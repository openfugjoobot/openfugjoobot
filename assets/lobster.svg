<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="OpenFugjooBot banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#1b2230"/>
    </linearGradient>
    <linearGradient id="lob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7a6b"/>
      <stop offset="100%" stop-color="#c22f3c"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#7ee0ff"/>
      <stop offset="100%" stop-color="#ff9d6b"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="220" rx="18" fill="url(#bg)"/>
  <rect width="900" height="220" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="898" height="218" rx="17" fill="none" stroke="#30363d" stroke-width="2"/>

  <circle cx="34" cy="32" r="6" fill="#ff5f56"/>
  <circle cx="56" cy="32" r="6" fill="#ffbd2e"/>
  <circle cx="78" cy="32" r="6" fill="#27c93f"/>
  <text x="866" y="37" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#6e7681" text-anchor="end">fugjoo ~ github</text>

  <!-- lobster -->
  <g transform="translate(118,120)">
    <!-- antennae -->
    <path d="M-30 -30 C-72 -74 -58 -104 -24 -92" stroke="#e2555f" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M30 -30 C72 -74 58 -104 24 -92" stroke="#e2555f" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="-24" cy="-92" r="4" fill="#ffb3a7"/>
    <circle cx="24" cy="-92" r="4" fill="#ffb3a7"/>
    <!-- legs -->
    <path d="M-40 16 C-64 24 -70 40 -64 54" stroke="#a82b34" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M-26 30 C-44 46 -46 64 -38 76" stroke="#a82b34" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M40 16 C64 24 70 40 64 54" stroke="#a82b34" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M26 30 C44 46 46 64 38 76" stroke="#a82b34" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- claws -->
    <g transform="translate(-58,-34) rotate(-18)">
      <ellipse cx="0" cy="0" rx="20" ry="13" fill="#c22f3c"/>
      <ellipse cx="22" cy="-8" rx="13" ry="8" fill="#e2555f" transform="rotate(-16)"/>
      <ellipse cx="22" cy="8" rx="13" ry="8" fill="#e2555f" transform="rotate(16)"/>
    </g>
    <g transform="translate(58,-34) rotate(18)">
      <ellipse cx="0" cy="0" rx="20" ry="13" fill="#c22f3c"/>
      <ellipse cx="-22" cy="-8" rx="13" ry="8" fill="#e2555f" transform="rotate(16)"/>
      <ellipse cx="-22" cy="8" rx="13" ry="8" fill="#e2555f" transform="rotate(-16)"/>
    </g>
    <!-- carapace + tail -->
    <ellipse cx="0" cy="44" rx="40" ry="30" fill="url(#lob)" opacity="0.9"/>
    <path d="M-34 66 C-16 82 16 82 34 66" stroke="#a82b34" stroke-width="2" fill="none" opacity="0.6"/>
    <ellipse cx="0" cy="6" rx="48" ry="38" fill="url(#lob)"/>
    <ellipse cx="0" cy="6" rx="48" ry="38" fill="none" stroke="#7d1f27" stroke-width="2"/>
    <path d="M-30 -12 C-12 -22 12 -22 30 -12" stroke="#ffb3a7" stroke-width="2" fill="none" opacity="0.45"/>
    <!-- eyes -->
    <ellipse cx="-17" cy="-2" rx="10" ry="11" fill="#ffffff"/>
    <ellipse cx="17" cy="-2" rx="10" ry="11" fill="#ffffff"/>
    <circle cx="-16" cy="0" r="5" fill="#0d1117"/>
    <circle cx="18" cy="0" r="5" fill="#0d1117"/>
    <circle cx="-14.5" cy="-2" r="1.8" fill="#ffffff"/>
    <circle cx="19.5" cy="-2" r="1.8" fill="#ffffff"/>
  </g>

  <g filter="url(#glow)">
    <text x="228" y="92" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="52" font-weight="700" fill="url(#txt)">OpenFugjooBot</text>
  </g>
  <text x="230" y="124" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#8b949e">$ whoami</text>
  <text x="230" y="150" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#7ee0ff">autonomous dev-bot · junior dev · 🦞</text>
  <text x="230" y="180" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#6e7681">South Tyrol · Python · TypeScript · public transport data · open source</text>
</svg>
